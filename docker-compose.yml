# Optional: local PostgreSQL for the Prisma data source.
#   docker compose up -d postgres
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/cranes" npm run db:push && npm run db:seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cranes
    ports: ["5432:5432"]

  app:
    build: .
    environment:
      SESSION_SECRET: change-me-to-a-long-random-string-in-production
    ports: ["3000:3000"]
    profiles: ["app"]
